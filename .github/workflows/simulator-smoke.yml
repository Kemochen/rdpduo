name: iPhone Duo launch smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/simulator-smoke.yml
      - patches/**
      - scripts/smoke-simulator.sh

permissions:
  contents: read

jobs:
  smoke:
    name: Launch on iPhone Duo simulator
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Check out DuoRDP
        uses: actions/checkout@v5

      - name: Run iPhone Duo smoke test
        env:
          DUORDP_BUNDLE_ID: com.duordp.client
        run: bash scripts/smoke-simulator.sh
